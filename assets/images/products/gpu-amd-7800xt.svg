      <circle cx="310" cy="300" r="9.36" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
    </g>
                <g>
      <circle cx="495" cy="300" r="78" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="495" cy="300" r="74" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 495 300 Q 526.2 276.6 553.5 261"/>
        <path d="M 495 300 Q 534 315.6 561.3 319.5"/>
        <path d="M 495 300 Q 510.6 339 522.3 363.96"/>
        <path d="M 495 300 Q 471.6 331.2 456 358.5"/>
