        <path d="M 370 235 Q 346 217 328 200.2"/>
        <path d="M 370 235 Q 364 205 361 183.4"/>
        <path d="M 370 235 Q 388 205 391 185.8"/>
      </g>
      <circle cx="370" cy="235" r="20.4" fill="#18202C" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="370" cy="235" r="7.2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    </g>
                <g>
      <circle cx="505" cy="235" r="60" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="505" cy="235" r="56" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 505 235 Q 529 217 550 205"/>
        <path d="M 505 235 Q 535 247 556 250"/>
        <path d="M 505 235 Q 517 265 526 284.2"/>
        <path d="M 505 235 Q 487 259 475 280"/>
        <path d="M 505 235 Q 475 241 454 244"/>
        <path d="M 505 235 Q 481 217 463 200.2"/>
        <path d="M 505 235 Q 499 205 496 183.4"/>
        <path d="M 505 235 Q 523 205 526 185.8"/>
      </g>
      <circle cx="505" cy="235" r="20.4" fill="#18202C" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="505" cy="235" r="7.2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    </g>
            <!-- Braided FEP Liquid Tubing -->
            <path d="M 565 250 C 630 270, 620 400, 515 415" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
            <path d="M 565 275 C 650 300, 640 430, 515 440" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
            <!-- Pump / Coldplate Block with Digital Telemetry Display -->
            <circle cx="455" cy="422" r="56" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="3"/>
            <circle cx="455" cy="422" r="42" fill="#090D14" stroke="#38BDF8" stroke-width="2.5"/>
            <text x="455" y="418" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700">34 C</text>
            <text x="455" y="436" text-anchor="middle" fill="#38BDF8" font-family="Inter, monospace" font-size="9" font-weight="700" letter-spacing="1.2">MOBIUS 140P</text>
  </g>

  <!-- Bottom Caption Overlay -->
  <g>
    <text x="32" y="564" fill="#F8FAFC" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">COOLER MASTER MOBIUS 140P ARGB 140MM FAN</text>
    <text x="32" y="583" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">140mm Ring Blade Design | Loop Dynamic Bearing | High Static Pressure</text>
    <text x="768" y="576" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE HARDWARE RENDER</text>
