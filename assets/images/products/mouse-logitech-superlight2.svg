<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#151C28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3646"/>
      <stop offset="45%" stop-color="#1B212C"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="darkAnodized" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C3A"/>
      <stop offset="100%" stop-color="#0E1218"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="#0B0D10"/>
  <rect width="800" height="600" fill="url(#studioGlow)"/>
  <rect width="800" height="600" fill="url(#techGrid)"/>

  <!-- Studio Floor Pedestal Reflection Line -->
  <ellipse cx="400" cy="525" rx="270" ry="22" fill="#050709" opacity="0.8"/>
  <line x1="80" y1="525" x2="720" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="250" y1="525" x2="550" y2="525" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Technical Telemetry Bar -->
  <g opacity="0.85">
    <rect x="28" y="24" width="140" height="24" rx="4" fill="#131822" stroke="#263042" stroke-width="1"/>
    <circle cx="42" cy="36" r="3.5" fill="#3B82F6"/>
    <text x="53" y="40" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">GAMING MOUSE</text>
    <text x="772" y="40" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1.5">BYTEFORGE // STUDIO SPEC</text>
  </g>

  <!-- Main Hardware Render -->
  <g filter="url(#dropShadow)">
                <!-- Contoured Symmetrical / Ergo Pro Mouse Shell -->
            <path d="M 325 180 C 325 130, 475 130, 475 180 L 488 345 C 492 435, 308 435, 312 345 Z" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="2.5"/>
            <!-- Split Trigger Buttons &amp; Seam -->
            <path d="M 326 255 Q 400 268 474 255" fill="none" stroke="#0B0D10" stroke-width="3"/>
            <line x1="400" y1="142" x2="400" y2="260" stroke="#0B0D10" stroke-width="3"/>
            <!-- Anodized Scroll Wheel -->
            <rect x="388" y="168" width="24" height="54" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
            <line x1="392" y1="184" x2="408" y2="184" stroke="#64748B" stroke-width="2"/>
            <line x1="392" y1="195" x2="408" y2="195" stroke="#64748B" stroke-width="2"/>
            <line x1="392" y1="206" x2="408" y2="206" stroke="#64748B" stroke-width="2"/>
            <!-- DPI LED &amp; Side Thumb Buttons -->
            <circle cx="400" cy="240" r="4" fill="#3B82F6"/>
            <rect x="312" y="255" width="7" height="32" rx="3" fill="#3B82F6"/>
            <rect x="310" y="294" width="7" height="28" rx="3" fill="#64748B"/>
            <!-- Palm Emblem -->
            <text x="400" y="365" text-anchor="middle" fill="#94A3B8" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SUPERLIGHT 2</text>
            <text x="400" y="383" text-anchor="middle" fill="#3B82F6" font-family="Inter, monospace" font-size="10">60G // 4000HZ</text>
  </g>

  <!-- Bottom Caption Overlay -->
  <g>
    <text x="32" y="564" fill="#F8FAFC" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">LOGITECH G PRO X SUPERLIGHT 2 WIRELESS</text>
    <text x="32" y="583" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">60g Ultralight | HERO 2 32K Sensor | LIGHTFORCE Hybrid Optical Switches</text>
    <text x="768" y="576" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE HARDWARE RENDER</text>
  </g>
</svg>
