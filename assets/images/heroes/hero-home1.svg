<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#151C28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3646"/>
      <stop offset="45%" stop-color="#1B212C"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="darkAnodized" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C3A"/>
      <stop offset="100%" stop-color="#0E1218"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="960" height="640" fill="#0B0D10"/>
  <rect width="960" height="640" fill="url(#studioGlow)"/>
  <rect width="960" height="640" fill="url(#techGrid)"/>

  <!-- Studio Floor Pedestal Reflection Line -->
  <ellipse cx="480" cy="565" rx="270" ry="22" fill="#050709" opacity="0.8"/>
  <line x1="80" y1="565" x2="880" y2="565" stroke="#1E293B" stroke-width="1"/>
  <line x1="250" y1="565" x2="710" y2="565" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Technical Telemetry Bar -->
  <g opacity="0.85">
    <rect x="28" y="24" width="140" height="24" rx="4" fill="#131822" stroke="#263042" stroke-width="1"/>
    <circle cx="42" cy="36" r="3.5" fill="#3B82F6"/>
    <text x="53" y="40" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">FLAGSHIP SYSTEM</text>
    <text x="932" y="40" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1.5">BYTEFORGE // STUDIO SPEC</text>
  </g>

  <!-- Main Hardware Render -->
  <g filter="url(#dropShadow)">
      <!-- Custom Liquid-Cooled Gaming &amp; Workstation Tower (Right Center) -->
  <g transform="translate(360, 45)">
    <rect x="120" y="30" width="340" height="440" rx="14" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="3"/>
    <!-- Front Mesh Bezel -->
    <rect x="385" y="42" width="62" height="416" rx="8" fill="#0D121A" stroke="#334155" stroke-width="1.5"/>
    <line x1="398" y1="65" x2="398" y2="435" stroke="#3B82F6" stroke-width="3"/>
    <!-- Tempered Glass Showcase Window -->
    <rect x="136" y="46" width="238" height="315" rx="8" fill="#090D14" stroke="#475569" stroke-width="2"/>
    <!-- Internal Motherboard &amp; AIO Pump -->
    <rect x="155" y="68" width="165" height="205" rx="6" fill="#131B28" stroke="#2D3A4F" stroke-width="1.5"/>
    <circle cx="235" cy="138" r="32" fill="#0B0F17" stroke="#3B82F6" stroke-width="3"/>
    <text x="235" y="143" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700">31 C</text>
    <!-- Braided AIO Tubes -->
    <path d="M 267 138 Q 335 135 348 95" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M 267 150 Q 335 155 348 115" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
    <!-- Horizontal Flagship GPU inside Chassis -->
    <rect x="148" y="205" width="210" height="52" rx="6" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="2"/>
    <line x1="158" y1="222" x2="348" y2="222" stroke="#3B82F6" stroke-width="3"/>
    <text x="253" y="242" text-anchor="middle" fill="#E2E8F0" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" letter-spacing="2">GEFORCE RTX // STUDIO</text>
    <!-- PSU Shroud -->
    <rect x="136" y="370" width="238" height="88" rx="6" fill="#111722" stroke="#334155" stroke-width="1.5"/>
    <text x="255" y="415" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700" letter-spacing="3">BYTEFORGE</text>
    <text x="255" y="434" text-anchor="middle" fill="#3B82F6" font-family="Inter, monospace" font-size="10" letter-spacing="1.5">CUSTOM ARCHITECTURE</text>
  </g>
  <!-- Foreground Component Array (GPU + CPU + DDR5) -->
  <g transform="translate(45, 220)">
    <rect x="20" y="60" width="340" height="145" rx="12" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="2.5"/>
    <line x1="35" y1="74" x2="345" y2="74" stroke="#3B82F6" stroke-width="2.5"/>
        <g>
      <circle cx="115" cy="135" r="48" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="115" cy="135" r="44" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 115 135 Q 134.2 120.6 151 111"/>
        <path d="M 115 135 Q 139 144.6 155.8 147"/>
        <path d="M 115 135 Q 124.6 159 131.8 174.36"/>
        <path d="M 115 135 Q 100.6 154.2 91 171"/>
        <path d="M 115 135 Q 91 139.8 74.2 142.2"/>
        <path d="M 115 135 Q 95.8 120.6 81.4 107.16"/>
        <path d="M 115 135 Q 110.2 111 107.8 93.72"/>
        <path d="M 115 135 Q 129.4 111 131.8 95.64"/>
      </g>
      <circle cx="115" cy="135" r="16.32" fill="#18202C" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="115" cy="135" r="5.76" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
        <g>
      <circle cx="255" cy="135" r="48" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="255" cy="135" r="44" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 255 135 Q 274.2 120.6 291 111"/>
        <path d="M 255 135 Q 279 144.6 295.8 147"/>
        <path d="M 255 135 Q 264.6 159 271.8 174.36"/>
        <path d="M 255 135 Q 240.6 154.2 231 171"/>
        <path d="M 255 135 Q 231 139.8 214.2 142.2"/>
        <path d="M 255 135 Q 235.8 120.6 221.4 107.16"/>
        <path d="M 255 135 Q 250.2 111 247.8 93.72"/>
        <path d="M 255 135 Q 269.4 111 271.8 95.64"/>
      </g>
      <circle cx="255" cy="135" r="16.32" fill="#18202C" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="255" cy="135" r="5.76" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
    <rect x="145" y="64" width="85" height="18" rx="3" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="187" y="77" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" letter-spacing="1">RTX 4090 CLASS</text>
  </g>
  </g>

  <!-- Bottom Caption Overlay -->
  <g>
    <text x="32" y="604" fill="#F8FAFC" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">BYTEFORGE APEX-X1 ARCHITECTURE</text>
    <text x="32" y="623" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">Precision Custom PC Hardware &amp; Enthusiast Component Ecosystem</text>
    <text x="928" y="616" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE HARDWARE RENDER</text>
  </g>
</svg>
