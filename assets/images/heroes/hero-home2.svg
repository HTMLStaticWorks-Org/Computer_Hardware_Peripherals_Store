<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#151C28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3646"/>
      <stop offset="45%" stop-color="#1B212C"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="darkAnodized" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C3A"/>
      <stop offset="100%" stop-color="#0E1218"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="960" height="600" fill="#0B0D10"/>
  <rect width="960" height="600" fill="url(#studioGlow)"/>
  <rect width="960" height="600" fill="url(#techGrid)"/>

  <!-- Studio Floor Pedestal Reflection Line -->
  <ellipse cx="480" cy="525" rx="270" ry="22" fill="#050709" opacity="0.8"/>
  <line x1="80" y1="525" x2="880" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="250" y1="525" x2="710" y2="525" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Technical Telemetry Bar -->
  <g opacity="0.85">
    <rect x="28" y="24" width="140" height="24" rx="4" fill="#131822" stroke="#263042" stroke-width="1"/>
    <circle cx="42" cy="36" r="3.5" fill="#3B82F6"/>
    <text x="53" y="40" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">CUSTOM LABS</text>
    <text x="932" y="40" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1.5">BYTEFORGE // STUDIO SPEC</text>
  </g>

  <!-- Main Hardware Render -->
  <g filter="url(#dropShadow)">
      <!-- Dual Monitor Enthusiast Workstation &amp; Tower Setup -->
  <!-- Left Studio Monitor -->
  <g transform="translate(55, 115)">
    <rect x="0" y="0" width="330" height="205" rx="8" fill="#0B0E14" stroke="url(#silverTrim)" stroke-width="2.5"/>
    <rect x="8" y="8" width="314" height="185" rx="4" fill="#0F172A"/>
    <polyline points="20,165 95,110 165,135 245,65 305,80" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <text x="26" y="36" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700">4K 240Hz QD-OLED // TELEMETRY</text>
    <text x="26" y="54" fill="#3B82F6" font-family="Inter, monospace" font-size="10">GPU: 99% LOAD // 58 C // 165 FPS</text>
    <rect x="145" y="205" width="40" height="55" fill="url(#metalBody)"/>
    <rect x="95" y="258" width="140" height="10" rx="3" fill="url(#silverTrim)"/>
  </g>
  <!-- Center-Right Ultrawide Monitor -->
  <g transform="translate(405, 115)">
    <rect x="0" y="0" width="330" height="205" rx="8" fill="#0B0E14" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="8" y="8" width="314" height="185" rx="4" fill="#0F172A"/>
    <circle cx="165" cy="100" r="56" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="165" cy="100" r="34" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="165" y="105" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700">WORKSTATION PRO</text>
    <rect x="145" y="205" width="40" height="55" fill="url(#metalBody)"/>
    <rect x="95" y="258" width="140" height="10" rx="3" fill="url(#silverTrim)"/>
  </g>
  <!-- Custom Tower on Right -->
  <g transform="translate(755, 75)">
    <rect x="0" y="0" width="155" height="310" rx="10" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="2.5"/>
    <rect x="12" y="14" width="131" height="220" rx="6" fill="#090D14" stroke="#334155" stroke-width="1.5"/>
    <circle cx="77" cy="82" r="24" fill="#0F172A" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="20" y="138" width="115" height="32" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="12" y="244" width="131" height="52" rx="4" fill="#111722"/>
  </g>
  <!-- Desk Surface with Mechanical Keyboard &amp; Precision Mouse -->
  <rect x="240" y="405" width="290" height="55" rx="8" fill="url(#metalBody)" stroke="url(#silverTrim)" stroke-width="2"/>
  <rect x="255" y="415" width="260" height="35" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <rect x="570" y="410" width="38" height="52" rx="18" fill="url(#metalBody)" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <!-- Bottom Caption Overlay -->
  <g>
    <text x="32" y="564" fill="#F8FAFC" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">ENTHUSIAST &amp; WORKSTATION COMMAND SETUP</text>
    <text x="32" y="583" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">Engineered for 4K High-Refresh Gaming, 3D Compute &amp; Studio Workflows</text>
    <text x="928" y="576" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE HARDWARE RENDER</text>
  </g>
</svg>
