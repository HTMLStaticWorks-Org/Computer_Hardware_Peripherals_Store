<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#151C28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3646"/>
      <stop offset="45%" stop-color="#1B212C"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="darkAnodized" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C3A"/>
      <stop offset="100%" stop-color="#0E1218"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="#0B0D10"/>
  <rect width="800" height="600" fill="url(#studioGlow)"/>
  <rect width="800" height="600" fill="url(#techGrid)"/>

  <!-- Studio Floor Pedestal Reflection Line -->
  <ellipse cx="400" cy="525" rx="270" ry="22" fill="#050709" opacity="0.8"/>
  <line x1="80" y1="525" x2="720" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="250" y1="525" x2="550" y2="525" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Technical Telemetry Bar -->
  <g opacity="0.85">
    <rect x="28" y="24" width="140" height="24" rx="4" fill="#131822" stroke="#263042" stroke-width="1"/>
    <circle cx="42" cy="36" r="3.5" fill="#3B82F6"/>
    <text x="53" y="40" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">GRAPHICS</text>
    <text x="772" y="40" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1.5">BYTEFORGE // STUDIO SPEC</text>
  </g>

  <!-- Main Hardware Render -->
  <g filter="url(#dropShadow)">
                <!-- PCIe Bracket -->
            <path d="M115 170 H140 V445 H125 V420 H115 Z" fill="url(#silverTrim)"/>
            <rect x="122" y="210" width="8" height="28" rx="1" fill="#0B0D10"/>
            <rect x="122" y="250" width="8" height="28" rx="1" fill="#0B0D10"/>
            <rect x="122" y="290" width="8" height="28" rx="1" fill="#0B0D10"/>
            <rect x="122" y="330" width="8" height="28" rx="1" fill="#0B0D10"/>
            <!-- Copper Heatpipes &amp; Fin Stack Top/Bottom -->
            <rect x="165" y="182" width="470" height="14" rx="4" fill="#1E293B"/>
            <rect x="180" y="186" width="440" height="4" rx="2" fill="url(#copperPipe)"/>
            <!-- Gold PCIe Fingers -->
            <rect x="200" y="408" width="210" height="16" rx="2" fill="url(#goldPins)"/>
            <rect x="235" y="408" width="8" height="16" fill="#0B0D10"/>
            <!-- Main GPU Shroud -->
            <rect x="140" y="192" width="525" height="216" rx="14" fill="url(#metalBody)" stroke="#334155" stroke-width="2.5"/>
            <!-- Geometric Shroud Armour Lines -->
            <polygon points="155,204 295,204 275,222 155,222" fill="url(#silverTrim)" opacity="0.8"/>
            <polygon points="505,204 650,204 650,222 525,222" fill="url(#silverTrim)" opacity="0.8"/>
            <polygon points="315,382 485,382 505,398 295,398" fill="url(#silverTrim)" opacity="0.7"/>
            <line x1="160" y1="200" x2="645" y2="200" stroke="#3B82F6" stroke-width="3"/>
            <!-- 16-Pin 12V-2x6 Power Header -->
            <rect x="575" y="180" width="46" height="14" rx="2" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
            <!-- Triple Axial Fans -->
                <g>
      <circle cx="245" cy="300" r="68" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="245" cy="300" r="64" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 245 300 Q 272.2 279.6 296 266"/>
        <path d="M 245 300 Q 279 313.6 302.8 317"/>
        <path d="M 245 300 Q 258.6 334 268.8 355.76"/>
        <path d="M 245 300 Q 224.6 327.2 211 351"/>
        <path d="M 245 300 Q 211 306.8 187.2 310.2"/>
        <path d="M 245 300 Q 217.8 279.6 197.4 260.56"/>
        <path d="M 245 300 Q 238.2 266 234.8 241.52"/>
        <path d="M 245 300 Q 265.4 266 268.8 244.24"/>
      </g>
      <circle cx="245" cy="300" r="23.12" fill="#1E2530" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="245" cy="300" r="8.16" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
                <g>
      <circle cx="400" cy="300" r="68" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="400" cy="300" r="64" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 400 300 Q 427.2 279.6 451 266"/>
        <path d="M 400 300 Q 434 313.6 457.8 317"/>
        <path d="M 400 300 Q 413.6 334 423.8 355.76"/>
        <path d="M 400 300 Q 379.6 327.2 366 351"/>
        <path d="M 400 300 Q 366 306.8 342.2 310.2"/>
        <path d="M 400 300 Q 372.8 279.6 352.4 260.56"/>
        <path d="M 400 300 Q 393.2 266 389.8 241.52"/>
        <path d="M 400 300 Q 420.4 266 423.8 244.24"/>
      </g>
      <circle cx="400" cy="300" r="23.12" fill="#1E2530" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="400" cy="300" r="8.16" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
                <g>
      <circle cx="555" cy="300" r="68" fill="#0B0E14" stroke="#2E3846" stroke-width="3"/>
      <circle cx="555" cy="300" r="64" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="18,8" opacity="0.55"/>
      <g stroke="#283242" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M 555 300 Q 582.2 279.6 606 266"/>
        <path d="M 555 300 Q 589 313.6 612.8 317"/>
        <path d="M 555 300 Q 568.6 334 578.8 355.76"/>
        <path d="M 555 300 Q 534.6 327.2 521 351"/>
        <path d="M 555 300 Q 521 306.8 497.2 310.2"/>
        <path d="M 555 300 Q 527.8 279.6 507.4 260.56"/>
        <path d="M 555 300 Q 548.2 266 544.8 241.52"/>
        <path d="M 555 300 Q 575.4 266 578.8 244.24"/>
      </g>
      <circle cx="555" cy="300" r="23.12" fill="#1E2530" stroke="url(#silverTrim)" stroke-width="2"/>
      <circle cx="555" cy="300" r="8.16" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
            <!-- Model Plate -->
            <rect x="340" y="196" width="120" height="22" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
            <text x="400" y="211" text-anchor="middle" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">RTX / RADEON</text>
  </g>

  <!-- Bottom Caption Overlay -->
  <g>
    <text x="32" y="564" fill="#F8FAFC" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">GRAPHICS CARDS (GPU)</text>
    <text x="32" y="583" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">Triple-Fan Flagship, Compact Dual-Fan &amp; Workstation GPUs</text>
    <text x="768" y="576" text-anchor="end" fill="#64748B" font-family="Space Grotesk, monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE HARDWARE RENDER</text>
  </g>
</svg>
